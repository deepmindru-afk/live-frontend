<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detailed Admin Access Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f5f5f5; }
        .debug-section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; border-radius: 8px; background-color: white; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .warning { background-color: #fff3cd; border-color: #ffeaa7; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; border: none; border-radius: 4px; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-success { background-color: #28a745; color: white; }
        .btn-warning { background-color: #ffc107; color: black; }
        .btn-danger { background-color: #dc3545; color: white; }
        .log { background-color: #f8f9fa; padding: 10px; margin: 10px 0; border-radius: 3px; font-family: monospace; white-space: pre-wrap; max-height: 400px; overflow-y: auto; }
        .data-display { background-color: #e9ecef; padding: 15px; border-radius: 5px; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="debug-section">
        <h1>🔍 Detailed Admin Access Debug</h1>
        <p>Let's debug exactly what's happening with the admin access.</p>
    </div>

    <div class="debug-section">
        <h2>🧪 Debug Steps</h2>
        <button class="btn-primary" onclick="step1_checkCurrentState()">1. Check Current State</button>
        <button class="btn-success" onclick="step2_loginAsAdmin()">2. Login as Admin</button>
        <button class="btn-warning" onclick="step3_verifyData()">3. Verify Data Storage</button>
        <button class="btn-danger" onclick="step4_testAdminPage()">4. Test Admin Page Logic</button>
        <button class="btn-primary" onclick="step5_openAdminPage()">5. Open Admin Page</button>
        <div id="results" class="log">Click buttons to debug admin access...</div>
    </div>

    <div class="debug-section">
        <h2>📊 Current Data</h2>
        <div id="currentData" class="data-display">Click "Check Current State" to see data</div>
    </div>

    <script>
        function log(message) {
            const results = document.getElementById('results');
            const timestamp = new Date().toISOString();
            results.textContent += `[${timestamp}] ${message}\n`;
            results.scrollTop = results.scrollHeight;
        }

        function updateCurrentData() {
            const currentData = document.getElementById('currentData');
            const userStr = localStorage.getItem('user');
            const token = localStorage.getItem('jwt') || localStorage.getItem('token');
            
            let dataHtml = '<h3>LocalStorage Status:</h3>';
            dataHtml += `<strong>User Data:</strong> ${userStr ? 'Present' : 'Missing'}<br>`;
            dataHtml += `<strong>Token:</strong> ${token ? 'Present' : 'Missing'}<br><br>`;
            
            if (userStr) {
                try {
                    const user = JSON.parse(userStr);
                    dataHtml += '<h3>User Details:</h3>';
                    dataHtml += `<strong>ID:</strong> ${user._id || 'N/A'}<br>`;
                    dataHtml += `<strong>Email:</strong> ${user.email || 'N/A'}<br>`;
                    dataHtml += `<strong>Display Name:</strong> ${user.displayName || 'N/A'}<br>`;
                    dataHtml += `<strong>System Role:</strong> <span style="color: ${user.systemRole === 'ADMIN' ? 'green' : 'red'}">${user.systemRole || 'N/A'}</span><br>`;
                    dataHtml += `<strong>Raw Data:</strong> <code>${userStr}</code><br>`;
                } catch (e) {
                    dataHtml += `<strong>Error parsing user data:</strong> ${e.message}<br>`;
                    dataHtml += `<strong>Raw Data:</strong> <code>${userStr}</code><br>`;
                }
            }
            
            if (token) {
                dataHtml += '<h3>Token Details:</h3>';
                dataHtml += `<strong>Token (first 50 chars):</strong> ${token.substring(0, 50)}...<br>`;
                try {
                    const payload = JSON.parse(atob(token.split('.')[1]));
                    dataHtml += `<strong>Token Role:</strong> ${payload.systemRole || 'N/A'}<br>`;
                    dataHtml += `<strong>Token Email:</strong> ${payload.email || 'N/A'}<br>`;
                } catch (e) {
                    dataHtml += `<strong>Error parsing token:</strong> ${e.message}<br>`;
                }
            }
            
            currentData.innerHTML = dataHtml;
        }

        function step1_checkCurrentState() {
            log('🔍 Step 1: Checking current localStorage state...');
            updateCurrentData();
            
            const userStr = localStorage.getItem('user');
            const token = localStorage.getItem('jwt') || localStorage.getItem('token');
            
            if (!userStr) {
                log('❌ No user data found in localStorage');
                log('This means either:');
                log('1. User never logged in');
                log('2. User data was cleared');
                log('3. Login function failed to store data');
            } else {
                log('✅ User data found in localStorage');
                try {
                    const user = JSON.parse(userStr);
                    log(`User: ${user.displayName} (${user.email})`);
                    log(`Role: ${user.systemRole}`);
                } catch (e) {
                    log(`❌ Error parsing user data: ${e.message}`);
                }
            }
            
            if (!token) {
                log('❌ No token found in localStorage');
            } else {
                log('✅ Token found in localStorage');
            }
        }

        async function step2_loginAsAdmin() {
            log('🔐 Step 2: Logging in as admin...');
            
            try {
                const response = await fetch('http://localhost:3007/graphql', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        query: `
                            mutation AdminLogin($email: String!, $password: String!) {
                                login(email: $email, password: $password) {
                                    token
                                    user {
                                        _id
                                        email
                                        displayName
                                        systemRole
                                    }
                                }
                            }
                        `,
                        variables: {
                            email: 'admin@example.com',
                            password: 'admin123'
                        }
                    })
                });
                
                const data = await response.json();
                log(`Login response: ${JSON.stringify(data, null, 2)}`);
                
                if (data.errors) {
                    log(`❌ Login failed: ${JSON.stringify(data.errors, null, 2)}`);
                } else if (data.data && data.data.login) {
                    const { token, user } = data.data.login;
                    log('✅ Admin login successful!');
                    log(`User: ${user.displayName} (${user.systemRole})`);
                    
                    // Store the data as the fixed login functions would
                    localStorage.setItem('jwt', token);
                    localStorage.setItem('token', token);
                    localStorage.setItem('user', JSON.stringify(user));
                    
                    log('✅ Admin data stored in localStorage');
                    updateCurrentData();
                } else {
                    log('❌ Unexpected login response format');
                }
            } catch (error) {
                log(`❌ Login error: ${error.message}`);
            }
        }

        function step3_verifyData() {
            log('🔍 Step 3: Verifying data storage...');
            
            const userStr = localStorage.getItem('user');
            const token = localStorage.getItem('jwt') || localStorage.getItem('token');
            
            if (!userStr) {
                log('❌ User data not found - login may have failed');
                return;
            }
            
            if (!token) {
                log('❌ Token not found - login may have failed');
                return;
            }
            
            try {
                const user = JSON.parse(userStr);
                log('✅ Data verification successful:');
                log(`  - User ID: ${user._id}`);
                log(`  - Email: ${user.email}`);
                log(`  - Display Name: ${user.displayName}`);
                log(`  - System Role: ${user.systemRole}`);
                
                if (user.systemRole === 'ADMIN') {
                    log('✅ User has ADMIN role');
                } else {
                    log(`❌ User role is '${user.systemRole}', not 'ADMIN'`);
                    log('This is why access is denied!');
                }
            } catch (e) {
                log(`❌ Error parsing user data: ${e.message}`);
            }
        }

        function step4_testAdminPage() {
            log('🔐 Step 4: Testing admin page access logic...');
            
            const userStr = localStorage.getItem('user');
            if (!userStr) {
                log('❌ No user data - admin page will redirect to login');
                return;
            }
            
            try {
                const user = JSON.parse(userStr);
                log(`Testing admin access for user: ${user.displayName}`);
                log(`User role: ${user.systemRole}`);
                
                // Simulate the exact logic from the admin page
                if (user.systemRole !== 'ADMIN') {
                    log('❌ ACCESS DENIED - User is not admin');
                    log(`Expected: 'ADMIN', Got: '${user.systemRole}'`);
                    log('This is why you see "Only administrators can access this page"');
                } else {
                    log('✅ ACCESS GRANTED - User is admin');
                    log('Admin page should load successfully');
                }
            } catch (e) {
                log(`❌ Error in admin access logic: ${e.message}`);
            }
        }

        function step5_openAdminPage() {
            log('🚀 Step 5: Opening admin page...');
            log('If you still see "Access Denied", the issue is:');
            log('1. User role is not "ADMIN" in localStorage');
            log('2. Backend is returning wrong role');
            log('3. Frontend is not storing data correctly');
            log('');
            log('Check the browser console for any errors');
            
            // Open admin page
            window.open('/admin', '_blank');
        }

        // Auto-run on page load
        window.onload = function() {
            log('🔍 Detailed Admin Access Debug Ready!');
            log('This will help identify exactly why admin access is failing');
            log('');
            log('Debug steps:');
            log('1. Check Current State - See what data is in localStorage');
            log('2. Login as Admin - Perform fresh admin login');
            log('3. Verify Data - Check that data is stored correctly');
            log('4. Test Admin Page Logic - Simulate the access check');
            log('5. Open Admin Page - Test the actual page');
            log('');
            updateCurrentData();
        };
    </script>
</body>
</html>
