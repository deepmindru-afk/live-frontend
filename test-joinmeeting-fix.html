<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Join Meeting Fix</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        input { padding: 8px; margin: 5px; border: 1px solid #ddd; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Test Join Meeting Fix</h1>
    <p>This test will verify that the joinMeeting mutation now works with the correct ParticipantResponse structure.</p>
    
    <div>
        <input type="text" id="meetingId" placeholder="Meeting ID" value="68d207765abb5f8c5c3e428a">
        <input type="text" id="displayName" placeholder="Display Name" value="Test Participant">
        <button onclick="testJoinMeeting()">Test Join Meeting</button>
        <button onclick="clearLogs()">Clear Logs</button>
    </div>
    
    <div id="logs"></div>

    <script>
        const GRAPHQL_ENDPOINT = 'http://localhost:3007/graphql';
        
        function log(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const logDiv = document.createElement('div');
            logDiv.className = `log ${type}`;
            logDiv.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logsDiv.appendChild(logDiv);
            console.log(message);
        }
        
        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
        }
        
        async function testJoinMeeting() {
            const meetingId = document.getElementById('meetingId').value;
            const displayName = document.getElementById('displayName').value;
            
            if (!meetingId || !displayName) {
                log('❌ Please enter both Meeting ID and Display Name', 'error');
                return;
            }
            
            log('🧪 Starting joinMeeting test...', 'info');
            log(`Meeting ID: ${meetingId}`, 'info');
            log(`Display Name: ${displayName}`, 'info');
            
            try {
                const response = await fetch(GRAPHQL_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: `
                            mutation JoinMeeting($input: JoinParticipantInput!) {
                                joinMeeting(input: $input) {
                                    _id
                                    displayName
                                    role
                                    micState
                                    cameraState
                                    userId
                                    meetingId
                                }
                            }
                        `,
                        variables: {
                            input: {
                                meetingId: meetingId,
                                displayName: displayName,
                                role: 'PARTICIPANT'
                            }
                        }
                    })
                });
                
                const data = await response.json();
                log(`📡 Response received: ${JSON.stringify(data, null, 2)}`, 'info');
                
                if (data.errors) {
                    log(`❌ GraphQL Errors: ${JSON.stringify(data.errors, null, 2)}`, 'error');
                    
                    // Check if it's the old user field error
                    if (data.errors[0].message.includes('Cannot query field "user"')) {
                        log('❌ The user field error is still present!', 'error');
                    } else if (data.errors[0].message.includes('Did you mean "userId"')) {
                        log('❌ The userId suggestion error is still present!', 'error');
                    } else {
                        log(`❌ Different error: ${data.errors[0].message}`, 'error');
                    }
                } else if (data.data && data.data.joinMeeting) {
                    const result = data.data.joinMeeting;
                    if (result._id) {
                        log('✅ Successfully joined meeting!', 'success');
                        log(`🆔 Participant ID: ${result._id}`, 'success');
                        log(`👤 Display Name: ${result.displayName}`, 'success');
                        log(`🎭 Role: ${result.role}`, 'success');
                        log(`🎤 Mic State: ${result.micState}`, 'success');
                        log(`📹 Camera State: ${result.cameraState}`, 'success');
                        log(`👤 User ID: ${result.userId}`, 'success');
                        log(`🏠 Meeting ID: ${result.meetingId}`, 'success');
                    } else {
                        log('❌ Unexpected response structure', 'error');
                    }
                } else {
                    log('❌ No data in response', 'error');
                }
            } catch (error) {
                log(`❌ Network Error: ${error.message}`, 'error');
            }
        }
        
        // Auto-test on page load
        window.onload = function() {
            log('🚀 Page loaded, ready to test joinMeeting fix', 'info');
            log('💡 Use the Meeting ID from the backend logs: 68d207765abb5f8c5c3e428a', 'info');
        };
    </script>
</body>
</html>
