<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GraphQL Queries Fixed Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        .warning { color: orange; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>GraphQL Queries Fixed Test</h1>
    <p>This test verifies that all GraphQL queries now use the correct schema structure.</p>
    
    <div>
        <button onclick="testAllQueries()">Test All Queries</button>
        <button onclick="testSpecificQuery()">Test Specific Query</button>
        <button onclick="clearLogs()">Clear Logs</button>
    </div>
    
    <div id="logs"></div>

    <script>
        function log(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const logDiv = document.createElement('div');
            logDiv.className = `log ${type}`;
            logDiv.innerHTML = message;
            logsDiv.appendChild(logDiv);
            console.log(message);
        }
        
        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
        }
        
        function testAllQueries() {
            log('🧪 Testing all GraphQL queries...', 'info');
            
            const queries = [
                {
                    name: 'GET_MEETING_BY_ID',
                    query: `
                        query GetMeetingById($meetingId: ID!) {
                            getMeetingById(meetingId: $meetingId) {
                                _id
                                title
                                status
                                inviteCode
                                hostId
                            }
                        }
                    `,
                    variables: {
                        meetingId: '68d222ee84a81a5c3a4b17a1'
                    }
                },
                {
                    name: 'GET_MY_MEETINGS',
                    query: `
                        query GetMyMeetings($input: MeetingQueryInput!) {
                            getMeetings(input: $input) {
                                meetings {
                                    _id
                                    title
                                    status
                                    inviteCode
                                    hostId
                                }
                                total
                            }
                        }
                    `,
                    variables: {
                        input: {
                            hostId: '68ca0921de88db9ffb01974d'
                        }
                    }
                },
                {
                    name: 'JOIN_MEETING_BY_CODE',
                    query: `
                        query JoinMeetingByCode($inviteCode: String!) {
                            joinMeetingByCode(inviteCode: $inviteCode) {
                                _id
                                title
                                status
                                inviteCode
                                hostId
                            }
                        }
                    `,
                    variables: {
                        inviteCode: 'test-code'
                    }
                },
                {
                    name: 'GET_PARTICIPANTS_BY_MEETING',
                    query: `
                        query GetParticipantsByMeeting($meetingId: ID!) {
                            getParticipantsByMeeting(meetingId: $meetingId) {
                                _id
                                displayName
                                role
                                micState
                                cameraState
                            }
                        }
                    `,
                    variables: {
                        meetingId: '68d222ee84a81a5c3a4b17a1'
                    }
                }
            ];
            
            queries.forEach((query, index) => {
                setTimeout(() => {
                    testQuery(query);
                }, index * 500);
            });
        }
        
        function testSpecificQuery() {
            log('🎯 Testing specific query that was causing issues...', 'info');
            
            // Test the JOIN_MEETING_BY_CODE query that was fixed
            const query = {
                name: 'JOIN_MEETING_BY_CODE (Fixed)',
                query: `
                    query JoinMeetingByCode($inviteCode: String!) {
                        joinMeetingByCode(inviteCode: $inviteCode) {
                            _id
                            title
                            status
                            inviteCode
                            hostId
                        }
                    }
                `,
                variables: {
                    inviteCode: 'test-code'
                }
            };
            
            testQuery(query);
        }
        
        async function testQuery(query) {
            log(`🧪 Testing ${query.name}...`, 'info');
            
            try {
                const response = await fetch('http://localhost:3007/graphql', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI2OGNhMDkyMWRlODhkYjlmZmIwMTk3NGQiLCJlbWFpbCI6InJtY2JheHRAZ21haWwuY29tIiwiZGlzcGxheU5hbWUiOiJBZG1pbiIsInN5c3RlbVJvbGUiOiJUVVRPUiIsImlhdCI6MTc1ODYwMTAyNiwiZXhwIjoxNzU4NjExODI2fQ.SDILGdYZ9BQynmfVAq-HeQXzOBbkpPQWWgWMojgEvOw'
                    },
                    body: JSON.stringify({
                        query: query.query,
                        variables: query.variables
                    })
                });
                
                const data = await response.json();
                
                if (data.errors) {
                    const firstError = data.errors[0];
                    
                    // Check for the specific schema mismatch errors we're trying to fix
                    if (firstError.message.includes('Cannot query field "success"') || 
                        firstError.message.includes('Cannot query field "message"')) {
                        log(`❌ ${query.name}: Still has schema mismatch! ${firstError.message}`, 'error');
                    } else if (firstError.message.includes('TOKEN_NOT_EXIST') || 
                              firstError.message.includes('Unauthorized') ||
                              firstError.message.includes('not found') ||
                              firstError.message.includes('Invalid credentials') ||
                              firstError.message.includes('Meeting not found')) {
                        log(`✅ ${query.name}: Schema is correct (authorization/not found error is expected)`, 'success');
                    } else {
                        log(`⚠️ ${query.name}: Different error: ${firstError.message}`, 'warning');
                    }
                } else if (data.data) {
                    const queryName = Object.keys(data.data)[0];
                    const result = data.data[queryName];
                    
                    if (result && (result._id || Array.isArray(result))) {
                        log(`✅ ${query.name}: Query successful with correct schema!`, 'success');
                    } else {
                        log(`❌ ${query.name}: Unexpected response structure`, 'error');
                    }
                } else {
                    log(`❌ ${query.name}: No data or errors in response`, 'error');
                }
            } catch (error) {
                log(`❌ ${query.name}: Network error: ${error.message}`, 'error');
            }
        }
        
        // Auto-test on page load
        window.onload = function() {
            log('🚀 GraphQL Queries Fixed Test loaded', 'info');
            log('💡 This will test all queries to ensure schema mismatches are resolved', 'info');
        };
    </script>
</body>
</html>
