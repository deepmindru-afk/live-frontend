<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Fix Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        .warning { color: orange; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Token Fix Test</h1>
    <p>This test verifies that the frontend is now using the correct JWT token.</p>
    
    <div>
        <button onclick="testTokenFix()">Test Token Fix</button>
        <button onclick="clearLogs()">Clear Logs</button>
    </div>
    
    <div id="logs"></div>

    <script>
        function log(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const logDiv = document.createElement('div');
            logDiv.className = `log ${type}`;
            logDiv.innerHTML = message;
            logsDiv.appendChild(logDiv);
            console.log(message);
        }
        
        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
        }
        
        function testTokenFix() {
            log('🔧 Testing the token fix...', 'info');
            
            // Check what tokens are available
            const jwt = localStorage.getItem('jwt');
            const token = localStorage.getItem('token');
            const accessToken = localStorage.getItem('accessToken');
            const authToken = localStorage.getItem('authToken');
            
            log(`<strong>Available tokens:</strong><br>jwt: ${jwt ? 'Present' : 'Missing'}<br>token: ${token ? 'Present' : 'Missing'}<br>accessToken: ${accessToken ? 'Present' : 'Missing'}<br>authToken: ${authToken ? 'Present' : 'Missing'}`, 'info');
            
            // The frontend should now use 'jwt' token
            const frontendToken = jwt || token;
            
            if (!frontendToken) {
                log('❌ No token found for frontend to use', 'error');
                return;
            }
            
            log(`<strong>Frontend will use:</strong><br><pre>${frontendToken.substring(0, 50)}...</pre>`, 'info');
            
            // Test with the frontend token
            fetch('http://localhost:3007/graphql', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${frontendToken}`
                },
                body: JSON.stringify({
                    query: 'query { me { _id displayName email systemRole } }'
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.errors) {
                    const firstError = data.errors[0];
                    log(`❌ Frontend token still failing: ${firstError.message}`, 'error');
                    
                    if (firstError.message.includes('jwt malformed')) {
                        log('🔍 The token format is still malformed', 'error');
                    } else if (firstError.message.includes('jwt expired')) {
                        log('🔍 The token has expired', 'error');
                    } else if (firstError.message.includes('jwt signature')) {
                        log('🔍 The token signature is invalid', 'error');
                    } else {
                        log(`🔍 Other error: ${firstError.message}`, 'error');
                    }
                } else if (data.data) {
                    log(`✅ Frontend token now works! User: ${JSON.stringify(data.data.me, null, 2)}`, 'success');
                } else {
                    log('❌ Unexpected response from backend', 'error');
                }
            })
            .catch(error => {
                log(`❌ Network error: ${error.message}`, 'error');
            });
        }
        
        // Auto-test on page load
        window.onload = function() {
            log('🚀 Token Fix Test loaded', 'info');
            testTokenFix();
        };
    </script>
</body>
</html>
