<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSO Cookie Check</title>
  <meta name="robots" content="noindex,nofollow" />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Fira Sans', 'Droid Sans', 'Helvetica Neue', Arial, sans-serif; background: #f8fafc; margin: 0; padding: 32px; }
    .card { background: #fff; max-width: 720px; margin: 0 auto; padding: 24px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    .btn { background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 10px 16px; cursor: pointer; }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    code { background: #f1f5f9; padding: 4px 6px; border-radius: 6px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; }
  </style>
  <script>
    async function syncJwt() {
      const $status = document.getElementById('status');
      $status.textContent = 'Reading JWT from cookies via /api/auth/session-jwt ...';
      try {
        const tryKey = async (key) => {
          const r = await fetch('/api/auth/session-jwt?key=' + encodeURIComponent(key), { credentials: 'include' });
          if (r.ok) return r.json();
          return { success: false };
        };

        let data = await tryKey('JWT');
        if (!data.success) data = await tryKey('jwt');
        if (!data.success) data = await fetch('/api/auth/session-jwt', { credentials: 'include' }).then(r => r.json());

        if (!data || !data.success || !data.token) {
          $status.textContent = 'Failed: ' + ((data && data.message) || 'JWT not found in cookies');
          return;
        }
        const token = data.token;
        document.getElementById('token').textContent = token.substring(0, 60) + '...';
        localStorage.setItem('jwt', token);
        $status.textContent = 'Saved to localStorage as jwt. You can now navigate to the app.';
      } catch (e) {
        $status.textContent = 'Error: ' + (e && e.message ? e.message : 'Unexpected');
      }
    }
  </script>
  
</head>
<body>
  <div class="card">
    <h1>SSO Cookie → LocalStorage JWT Check</h1>
    <p>This utility reads an httpOnly cookie via an internal API and writes it into <code>localStorage</code> as <code>jwt</code>.</p>
    <p id="status">Idle</p>
    <p class="mono">token: <span id="token">(none)</span></p>
    <button class="btn" onclick="syncJwt()">Sync Now</button>
  </div>
</body>
</html>
