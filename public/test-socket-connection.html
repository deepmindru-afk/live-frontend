<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.io Connection Test</title>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
</head>
<body>
    <h1>Socket.io Connection Test</h1>
    <div id="status">Connecting...</div>
    <div id="messages"></div>
    <input type="text" id="messageInput" placeholder="Type a message">
    <button onclick="sendMessage()">Send Message</button>
    <button onclick="joinRoom()">Join Room</button>

    <script>
        // Get JWT token from localStorage (you'll need to login first)
        const token = localStorage.getItem('jwt');
        if (!token) {
            document.getElementById('status').innerHTML = '❌ No JWT token found. Please login first at <a href="http://localhost:3000" target="_blank">http://localhost:3000</a>';
            // Don't proceed without token
            return;
        }

        console.log('🔑 JWT Token:', token);
        console.log('🔌 Attempting to connect to Socket.io...');
        
        // Connect to Socket.io
        const socket = io('http://localhost:3007', {
            auth: {
                token: token,
            },
            transports: ['websocket', 'polling'],
            autoConnect: true,
            forceNew: true,
        });
        
        console.log('🔌 Socket.io client created:', socket);

        socket.on('connect', () => {
            document.getElementById('status').innerHTML = '✅ Connected to Socket.IO server with ID: ' + socket.id;
            console.log('Connected to Socket.IO server');
        });

        socket.on('disconnect', (reason) => {
            document.getElementById('status').innerHTML = '❌ Disconnected: ' + reason;
            console.log('Disconnected:', reason);
        });

        socket.on('connect_error', (error) => {
            document.getElementById('status').innerHTML = '❌ Connection error: ' + error.message;
            console.error('Connection error:', error);
        });

        socket.on('CHAT_MESSAGE', (message) => {
            console.log('Chat message received:', message);
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML += '<div>📨 ' + message.text + ' - ' + message.displayName + '</div>';
        });

        socket.on('CHAT_MESSAGE_SENT', (message) => {
            console.log('Chat message sent confirmation:', message);
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML += '<div>✅ Message sent: ' + message.text + '</div>';
        });

        socket.on('ERROR', (error) => {
            console.error('Socket error:', error);
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML += '<div>❌ Error: ' + error.message + '</div>';
        });

        function joinRoom() {
            const meetingId = prompt('Enter meeting ID:') || 'test-meeting-123';
            socket.emit('JOIN_ROOM', { meetingId, roomName: meetingId });
            console.log('Joining room:', meetingId);
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value;
            if (message) {
                const meetingId = 'test-meeting-123';
                socket.emit('CHAT_SEND', {
                    roomName: meetingId,
                    message: message,
                });
                console.log('Sending message:', message);
                input.value = '';
            }
        }

        // Auto-join room on load
        setTimeout(() => {
            joinRoom();
        }, 2000);
    </script>
</body>
</html>
