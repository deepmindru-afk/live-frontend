<!DOCTYPE html>
<html>
<head>
    <title>Direct WebSocket Test</title>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
</head>
<body>
    <h1>Direct WebSocket Test</h1>
    <div id="logs"></div>
    <button onclick="testDirect()">Test Direct Connection</button>

    <script>
        function log(msg) {
            document.getElementById('logs').innerHTML += '<div>' + new Date().toLocaleTimeString() + ': ' + msg + '</div>';
        }

        function testDirect() {
            log('Testing direct WebSocket connection...');
            
            const socket = io('http://localhost:3007/chat', {
                auth: { token: localStorage.getItem('jwt') },
                transports: ['websocket'],
                timeout: 5000
            });

            socket.on('connect', () => {
                log('✅ Connected! Socket ID: ' + socket.id);
                socket.emit('JOIN_CHAT_ROOM', { meetingId: '68d9d55aad3da2683f05b2d0' });
                log('📤 Sent JOIN_CHAT_ROOM');
            });

            socket.on('connect_error', (err) => {
                log('❌ Connection error: ' + err.message);
            });

            socket.on('ERROR', (data) => {
                log('❌ Server error: ' + data.message);
            });

            socket.on('CHAT_MESSAGES_LOADED', (data) => {
                log('📚 Messages loaded: ' + data.messages.length);
            });

            socket.on('disconnect', (reason) => {
                log('🔌 Disconnected: ' + reason);
            });
        }
    </script>
</body>
</html>
