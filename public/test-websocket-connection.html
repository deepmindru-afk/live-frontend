<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Connection Test</title>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #222; color: #eee; }
        #logs { border: 1px solid #444; height: 400px; overflow-y: scroll; background-color: #1a1a1a; padding: 10px; border-radius: 8px; }
        .log-entry { margin-bottom: 5px; border-bottom: 1px dotted #3a3a3a; padding-bottom: 3px; }
        .log-entry.info { color: #88c0d0; }
        .log-entry.success { color: #a3be8c; }
        .log-entry.error { color: #bf616a; }
        button { padding: 10px 15px; margin: 10px 5px; background-color: #5e81ac; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover:not(:disabled) { background-color: #81a1c1; }
    </style>
</head>
<body>
    <h1>WebSocket Connection Test</h1>
    
    <div>
        <button onclick="testConnection()">Test WebSocket Connection</button>
        <button onclick="testWithRealToken()">Test with Real JWT Token</button>
        <button onclick="clearLogs()">Clear Logs</button>
    </div>

    <h2>Connection Logs</h2>
    <div id="logs"></div>

    <script>
        const logsDiv = document.getElementById('logs');
        let socket;

        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logsDiv.appendChild(entry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        function clearLogs() {
            logsDiv.innerHTML = '';
        }

        function testConnection() {
            log('🔌 Testing WebSocket connection to /chat namespace...', 'info');
            
            if (socket) {
                socket.disconnect();
            }

            socket = io('http://localhost:3007/chat', {
                auth: {
                    token: 'test-token'
                },
                transports: ['websocket', 'polling'],
                timeout: 10000,
                forceNew: true
            });

            socket.on('connect', () => {
                log('✅ Connected to /chat namespace', 'success');
                log(`Socket ID: ${socket.id}`, 'info');
                
                // Try to join a chat room
                socket.emit('JOIN_CHAT_ROOM', { meetingId: '68d9d0e62c81a1772523dfe5' });
            });

            socket.on('disconnect', (reason) => {
                log(`🔌 Disconnected: ${reason}`, 'info');
            });

            socket.on('connect_error', (error) => {
                log(`❌ Connection error: ${error.message}`, 'error');
            });

            socket.on('ERROR', (data) => {
                log(`❌ Server error: ${data.message}`, 'error');
            });

            socket.on('CHAT_MESSAGES_LOADED', (data) => {
                log(`📚 Loaded ${data.messages.length} existing messages`, 'success');
            });

            socket.on('CHAT_MESSAGE', (message) => {
                log(`💬 New message: ${message.displayName}: ${message.text}`, 'success');
            });
        }

        function testWithRealToken() {
            const token = localStorage.getItem('jwt');
            if (!token) {
                log('❌ No JWT token found in localStorage', 'error');
                return;
            }

            log('🔌 Testing WebSocket connection with real JWT token...', 'info');
            log(`Token: ${token.substring(0, 50)}...`, 'info');
            
            if (socket) {
                socket.disconnect();
            }

            socket = io('http://localhost:3007/chat', {
                auth: {
                    token: token
                },
                transports: ['websocket', 'polling'],
                timeout: 10000,
                forceNew: true
            });

            socket.on('connect', () => {
                log('✅ Connected to /chat namespace with real token', 'success');
                log(`Socket ID: ${socket.id}`, 'info');
                
                // Try to join a chat room
                socket.emit('JOIN_CHAT_ROOM', { meetingId: '68d9d0e62c81a1772523dfe5' });
            });

            socket.on('disconnect', (reason) => {
                log(`🔌 Disconnected: ${reason}`, 'info');
            });

            socket.on('connect_error', (error) => {
                log(`❌ Connection error: ${error.message}`, 'error');
            });

            socket.on('ERROR', (data) => {
                log(`❌ Server error: ${data.message}`, 'error');
            });

            socket.on('CHAT_MESSAGES_LOADED', (data) => {
                log(`📚 Loaded ${data.messages.length} existing messages`, 'success');
                data.messages.forEach(msg => {
                    log(`  - ${msg.displayName}: ${msg.text}`, 'info');
                });
            });

            socket.on('CHAT_MESSAGE', (message) => {
                log(`💬 New message: ${message.displayName}: ${message.text}`, 'success');
            });

            socket.on('CHAT_USER_JOINED', (participant) => {
                log(`➕ User joined: ${participant.displayName}`, 'info');
            });

            socket.on('CHAT_PEER_LIST', (data) => {
                log(`👥 Participants: ${data.participants.map(p => p.displayName).join(', ')}`, 'info');
            });
        }
    </script>
</body>
</html>
