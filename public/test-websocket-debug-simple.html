<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple WebSocket Debug Test</title>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #222; color: #eee; }
        #logs { border: 1px solid #444; height: 400px; overflow-y: scroll; background-color: #1a1a1a; padding: 10px; border-radius: 8px; }
        .log-entry { margin-bottom: 5px; border-bottom: 1px dotted #3a3a3a; padding-bottom: 3px; }
        .log-entry.info { color: #88c0d0; }
        .log-entry.success { color: #a3be8c; }
        .log-entry.error { color: #bf616a; }
        button { padding: 10px 15px; margin: 10px; background-color: #5e81ac; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Simple WebSocket Debug Test</h1>
    
    <button onclick="testConnection()">Test WebSocket Connection</button>
    <button onclick="testWithToken()">Test with JWT Token</button>
    
    <h2>Logs</h2>
    <div id="logs"></div>

    <script>
        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            document.getElementById('logs').appendChild(entry);
            document.getElementById('logs').scrollTop = document.getElementById('logs').scrollHeight;
        }

        function testConnection() {
            log('🔌 Testing basic WebSocket connection...', 'info');
            
            const socket = io('http://localhost:3007/chat', {
                transports: ['websocket', 'polling'],
                timeout: 5000,
                forceNew: true,
            });

            socket.on('connect', () => {
                log('✅ Connected to WebSocket!', 'success');
                log(`Socket ID: ${socket.id}`, 'info');
                socket.disconnect();
            });

            socket.on('connect_error', (error) => {
                log(`❌ Connection error: ${error.message}`, 'error');
            });

            socket.on('disconnect', (reason) => {
                log(`🔌 Disconnected: ${reason}`, 'info');
            });
        }

        function testWithToken() {
            const token = localStorage.getItem('jwt');
            if (!token) {
                log('❌ No JWT token found in localStorage', 'error');
                return;
            }

            log('🔌 Testing WebSocket connection with JWT token...', 'info');
            log(`Token: ${token.substring(0, 20)}...`, 'info');
            
            const socket = io('http://localhost:3007/chat', {
                auth: { token },
                transports: ['websocket', 'polling'],
                timeout: 5000,
                forceNew: true,
            });

            socket.on('connect', () => {
                log('✅ Connected with JWT token!', 'success');
                log(`Socket ID: ${socket.id}`, 'info');
                
                // Test joining a chat room
                socket.emit('JOIN_CHAT_ROOM', { meetingId: '68d9d55aad3da2683f05b2d0' });
                log('📤 Sent JOIN_CHAT_ROOM event', 'info');
            });

            socket.on('connect_error', (error) => {
                log(`❌ Connection error: ${error.message}`, 'error');
            });

            socket.on('ERROR', (data) => {
                log(`❌ Server error: ${data.message}`, 'error');
            });

            socket.on('CHAT_MESSAGES_LOADED', (data) => {
                log(`📚 Loaded ${data.messages.length} messages`, 'success');
                data.messages.forEach(msg => {
                    log(`  - ${msg.displayName}: ${msg.text}`, 'info');
                });
            });

            socket.on('disconnect', (reason) => {
                log(`🔌 Disconnected: ${reason}`, 'info');
            });
        }
    </script>
</body>
</html>
