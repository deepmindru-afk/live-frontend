<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Heartbeat Connection</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .log { background: #f5f5f5; padding: 10px; margin: 5px 0; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🔍 Test Heartbeat Connection</h1>
    <p>This test verifies that the frontend can connect to the backend WebSocket and send heartbeats.</p>
    
    <div>
        <button onclick="connectToWebSocket()">Connect to WebSocket</button>
        <button onclick="startHeartbeat()">Start Heartbeat</button>
        <button onclick="stopHeartbeat()">Stop Heartbeat</button>
        <button onclick="clearLogs()">Clear Logs</button>
    </div>
    
    <div id="logs"></div>
    
    <script>
        let socket = null;
        let heartbeatInterval = null;
        const meetingId = '68e353f94eafeb8cef17b48b'; // Use a real meeting ID
        
        function log(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const logDiv = document.createElement('div');
            logDiv.className = `log ${type}`;
            logDiv.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
            logsDiv.appendChild(logDiv);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }
        
        function connectToWebSocket() {
            const token = localStorage.getItem('token');
            if (!token) {
                log('❌ No token found in localStorage', 'error');
                return;
            }
            
            log('🔌 Connecting to WebSocket...', 'info');
            
            try {
                socket = io('http://localhost:3007/signaling', {
                    auth: { token },
                    transports: ['websocket'],
                    timeout: 10000
                });
                
                socket.on('connect', () => {
                    log('✅ Connected to WebSocket with ID: ' + socket.id, 'success');
                    
                    // Join the meeting
                    log('📤 Joining meeting: ' + meetingId, 'info');
                    socket.emit('JOIN_MEETING', { meetingId });
                });
                
                socket.on('disconnect', (reason) => {
                    log('❌ Disconnected: ' + reason, 'error');
                });
                
                socket.on('connect_error', (error) => {
                    log('❌ Connection error: ' + error.message, 'error');
                });
                
                socket.on('MEETING_JOIN_SUCCESS', (data) => {
                    log('✅ Meeting join success: ' + JSON.stringify(data), 'success');
                });
                
                socket.on('HEARTBEAT_ACK', (data) => {
                    log('💓 Heartbeat acknowledged: ' + JSON.stringify(data), 'success');
                });
                
                socket.on('HEARTBEAT_ACK_LIGHT', (data) => {
                    log('💓 Heartbeat acknowledged (light): ' + JSON.stringify(data), 'info');
                });
                
                socket.on('ERROR', (data) => {
                    log('❌ Server error: ' + JSON.stringify(data), 'error');
                });
                
            } catch (error) {
                log('❌ Failed to create socket: ' + error.message, 'error');
            }
        }
        
        function startHeartbeat() {
            if (!socket || !socket.connected) {
                log('❌ WebSocket not connected', 'error');
                return;
            }
            
            log('💓 Starting heartbeat (every 5 seconds)...', 'info');
            
            heartbeatInterval = setInterval(() => {
                if (socket && socket.connected) {
                    log('💓 Sending heartbeat...', 'info');
                    socket.emit('HEARTBEAT', { meetingId });
                } else {
                    log('❌ WebSocket not connected, stopping heartbeat', 'error');
                    stopHeartbeat();
                }
            }, 5000);
        }
        
        function stopHeartbeat() {
            if (heartbeatInterval) {
                clearInterval(heartbeatInterval);
                heartbeatInterval = null;
                log('⏹️ Heartbeat stopped', 'info');
            }
        }
        
        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
        }
        
        // Auto-connect on page load
        window.onload = () => {
            log('🚀 Page loaded, ready to test', 'info');
            log('Token: ' + (localStorage.getItem('token') ? 'Present' : 'Missing'), 'info');
        };
    </script>
</body>
</html>
