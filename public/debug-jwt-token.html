<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWT Token Debug</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #222; color: #eee; }
        #logs { border: 1px solid #444; height: 400px; overflow-y: scroll; background-color: #1a1a1a; padding: 10px; border-radius: 8px; }
        .log-entry { margin-bottom: 5px; border-bottom: 1px dotted #3a3a3a; padding-bottom: 3px; }
        .log-entry.info { color: #88c0d0; }
        .log-entry.success { color: #a3be8c; }
        .log-entry.error { color: #bf616a; }
        .log-entry.warn { color: #ebcb8b; }
        button { padding: 10px 15px; margin: 10px 5px; background-color: #5e81ac; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover:not(:disabled) { background-color: #81a1c1; }
        pre { background-color: #1a1a1a; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>JWT Token Debug</h1>
    
    <div>
        <button onclick="checkJWT()">Check JWT Token</button>
        <button onclick="clearJWT()">Clear JWT Token</button>
        <button onclick="clearLogs()">Clear Logs</button>
    </div>

    <h2>JWT Token Analysis</h2>
    <div id="logs"></div>

    <script>
        const logsDiv = document.getElementById('logs');

        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logsDiv.appendChild(entry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        function clearLogs() {
            logsDiv.innerHTML = '';
        }

        function checkJWT() {
            log('🔍 Checking JWT token in localStorage...', 'info');
            
            const token = localStorage.getItem('jwt');
            
            if (!token) {
                log('❌ No JWT token found in localStorage', 'error');
                return;
            }

            log(`✅ JWT token found: ${token.length} characters`, 'success');
            log(`Token preview: ${token.substring(0, 50)}...`, 'info');
            
            // Check if it's a valid JWT format
            const parts = token.split('.');
            if (parts.length !== 3) {
                log(`❌ Invalid JWT format: Expected 3 parts, got ${parts.length}`, 'error');
                log(`Parts: ${parts.map((part, i) => `Part ${i}: ${part.length} chars`).join(', ')}`, 'error');
                return;
            }

            log('✅ JWT has correct 3-part format', 'success');
            
            try {
                // Decode header
                const header = JSON.parse(atob(parts[0]));
                log('✅ JWT Header decoded successfully:', 'success');
                log(`Header: ${JSON.stringify(header, null, 2)}`, 'info');
                
                // Decode payload
                const payload = JSON.parse(atob(parts[1]));
                log('✅ JWT Payload decoded successfully:', 'success');
                log(`Payload: ${JSON.stringify(payload, null, 2)}`, 'info');
                
                // Check expiration
                if (payload.exp) {
                    const expDate = new Date(payload.exp * 1000);
                    const now = new Date();
                    const isExpired = now > expDate;
                    
                    log(`Token expires: ${expDate.toLocaleString()}`, isExpired ? 'error' : 'success');
                    log(`Current time: ${now.toLocaleString()}`, 'info');
                    log(`Status: ${isExpired ? 'EXPIRED' : 'VALID'}`, isExpired ? 'error' : 'success');
                }
                
            } catch (error) {
                log(`❌ Error decoding JWT: ${error.message}`, 'error');
                log(`This suggests the token is malformed or corrupted`, 'error');
            }
        }

        function clearJWT() {
            localStorage.removeItem('jwt');
            log('🗑️ JWT token cleared from localStorage', 'warn');
            log('You will need to log in again to get a fresh token', 'info');
        }

        // Auto-check on page load
        window.onload = checkJWT;
    </script>
</body>
</html>
