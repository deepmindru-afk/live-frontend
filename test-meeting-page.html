<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Page Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        input { padding: 8px; margin: 5px; width: 200px; }
        .log { background-color: #f8f9fa; padding: 10px; margin: 10px 0; border-radius: 3px; font-family: monospace; white-space: pre-wrap; max-height: 400px; overflow-y: auto; }
        .meeting-demo { background-color: #1a1a1a; color: white; padding: 20px; border-radius: 8px; margin: 20px 0; }
        .sidebar { background-color: #2c3e50; width: 80px; height: 400px; display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 20px; }
        .control-btn { width: 50px; height: 50px; background-color: #34495e; border: none; border-radius: 50%; color: white; font-size: 20px; cursor: pointer; }
        .control-btn.active { background-color: #e74c3c; }
        .control-btn.blue { background-color: #3498db; }
        .video-area { background-color: #000; flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
        .participant-grid { position: absolute; top: 20px; left: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; max-width: 300px; }
        .participant-card { width: 150px; height: 100px; background-color: #333; border-radius: 8px; display: flex; align-items: center; justify-content: center; border: 1px solid #555; position: relative; }
        .status-bar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background-color: rgba(0, 0, 0, 0.8); padding: 8px 20px; border-radius: 20px; border: 2px solid #ffa500; display: flex; align-items: center; gap: 10px; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; }
        .status-dot.green { background-color: #28a745; }
        .status-dot.red { background-color: #dc3545; }
    </style>
</head>
<body>
    <h1>Meeting Page Test</h1>
    
    <div class="test-section">
        <h2>Test Meeting Operations</h2>
        <input type="text" id="meetingId" placeholder="Meeting ID" value="test-meeting-123">
        <button onclick="testJoinMeeting()">Join Meeting</button>
        <button onclick="testLeaveMeeting()">Leave Meeting</button>
        <button onclick="testGetMeeting()">Get Meeting Details</button>
        <button onclick="testChatHistory()">Get Chat History</button>
    </div>

    <div class="test-section">
        <h2>Test Results</h2>
        <div id="results" class="log">Click a button to test...</div>
    </div>

    <div class="test-section">
        <h2>Meeting UI Demo</h2>
        <div class="meeting-demo" style="display: flex; height: 400px;">
            <!-- Left Sidebar -->
            <div class="sidebar">
                <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
                    <div style="width: 40px; height: 40px; background-color: #3498db; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px;">👤</div>
                    <div style="width: 40px; height: 40px; background-color: #95a5a6; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px;">📄</div>
                    <span style="font-size: 12px; text-align: center;">문서</span>
                </div>
                
                <div style="display: flex; flex-direction: column; gap: 15px; flex: 1; justify-content: center;">
                    <button class="control-btn" onclick="toggleControl('mic')">🎤</button>
                    <button class="control-btn" onclick="toggleControl('camera')">📷</button>
                    <button class="control-btn" onclick="toggleControl('screen')">📺</button>
                    <button class="control-btn blue" onclick="toggleControl('chat')">💬</button>
                    <button class="control-btn" onclick="toggleControl('calendar')">📅</button>
                </div>
                
                <button class="control-btn" style="background-color: #e74c3c; border-radius: 8px;" onclick="leaveMeeting()">🚪</button>
            </div>
            
            <!-- Main Video Area -->
            <div class="video-area">
                <div style="text-align: center; color: #888; font-size: 48px; font-weight: bold;">3</div>
                
                <!-- Participant Grid -->
                <div class="participant-grid">
                    <div class="participant-card" style="border: 2px solid #f39c12;">
                        <div style="text-align: center; color: #888;">
                            <div style="font-size: 24px; margin-bottom: 4px;">👤</div>
                            <div style="font-size: 10px;">호스트</div>
                        </div>
                        <div style="position: absolute; top: 4px; right: 4px; display: flex; gap: 2px;">
                            <div style="width: 16px; height: 16px; background-color: #28a745; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 8px;">✓</div>
                        </div>
                    </div>
                    
                    <div class="participant-card">
                        <div style="text-align: center; color: #888;">
                            <div style="font-size: 24px; margin-bottom: 4px;">👤</div>
                            <div style="font-size: 10px;">참여자 1</div>
                        </div>
                        <div style="position: absolute; top: 4px; right: 4px; display: flex; gap: 2px;">
                            <div style="width: 16px; height: 16px; background-color: #e74c3c; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 8px;">🔇</div>
                        </div>
                    </div>
                    
                    <div class="participant-card">
                        <div style="text-align: center; color: #888;">
                            <div style="font-size: 24px; margin-bottom: 4px;">📷</div>
                            <div style="font-size: 10px;">참여자 2</div>
                        </div>
                        <div style="position: absolute; top: 4px; right: 4px; display: flex; gap: 2px;">
                            <div style="width: 16px; height: 16px; background-color: #e74c3c; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 8px;">📷</div>
                        </div>
                    </div>
                </div>
                
                <!-- Status Bar -->
                <div class="status-bar">
                    <div class="status-dot green"></div>
                    <span style="color: white; font-size: 16px; font-weight: bold;">3</span>
                    <div class="status-dot red"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GRAPHQL_ENDPOINT = 'http://localhost:3007/graphql';
        let controlStates = { mic: false, camera: false, screen: false, chat: false, calendar: false };
        
        function log(message) {
            const results = document.getElementById('results');
            const timestamp = new Date().toISOString();
            results.textContent += `[${timestamp}] ${message}\n`;
            results.scrollTop = results.scrollHeight;
        }

        async function makeGraphQLRequest(query, variables = {}) {
            const response = await fetch(GRAPHQL_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query, variables }),
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();
            
            if (data.errors) {
                throw new Error(data.errors[0]?.message || 'GraphQL error');
            }

            return data.data;
        }

        async function testJoinMeeting() {
            try {
                const meetingId = document.getElementById('meetingId').value;
                log(`🚪 Testing join meeting: ${meetingId}`);
                
                // Test with real backend first
                try {
                    const realResult = await makeGraphQLRequest(`
                        mutation JoinMeeting($meetingId: ID!) {
                            joinMeeting(meetingId: $meetingId) {
                                success
                                message
                                isHost
                                participant {
                                    _id
                                    displayName
                                    email
                                }
                            }
                        }
                    `, { meetingId });
                    
                    log('✅ Join meeting via real backend:');
                    log(JSON.stringify(realResult, null, 2));
                    return;
                } catch (realError) {
                    log(`⚠️ Real backend failed (expected): ${realError.message}`);
                }

                // Fallback to mock service
                const mockResult = {
                    joinMeeting: {
                        success: true,
                        message: 'Successfully joined meeting',
                        isHost: true,
                        participant: {
                            _id: 'participant-' + Date.now(),
                            displayName: 'Test Participant',
                            email: 'participant@example.com'
                        }
                    }
                };
                
                log('✅ Join meeting via mock service:');
                log(JSON.stringify(mockResult, null, 2));
                
            } catch (error) {
                log(`❌ Join meeting error: ${error.message}`);
            }
        }

        async function testLeaveMeeting() {
            try {
                const meetingId = document.getElementById('meetingId').value;
                log(`🚪 Testing leave meeting: ${meetingId}`);
                
                const mockResult = {
                    leaveMeeting: {
                        success: true,
                        message: 'Successfully left meeting'
                    }
                };
                
                log('✅ Leave meeting via mock service:');
                log(JSON.stringify(mockResult, null, 2));
                
            } catch (error) {
                log(`❌ Leave meeting error: ${error.message}`);
            }
        }

        async function testGetMeeting() {
            try {
                const meetingId = document.getElementById('meetingId').value;
                log(`📊 Testing get meeting: ${meetingId}`);
                
                const mockResult = {
                    meeting: {
                        _id: meetingId,
                        title: 'Test Meeting',
                        status: 'STARTED',
                        schedule: null,
                        inviteCode: 'ABC123',
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString(),
                        participantCount: 3,
                        duration: 3600,
                        participants: [
                            {
                                _id: 'participant-1',
                                displayName: 'Test Participant 1',
                                email: 'participant1@example.com',
                                isMuted: false,
                                isCameraOff: false,
                                joinedAt: new Date().toISOString(),
                                isHost: true
                            },
                            {
                                _id: 'participant-2',
                                displayName: 'Test Participant 2',
                                email: 'participant2@example.com',
                                isMuted: true,
                                isCameraOff: false,
                                joinedAt: new Date().toISOString(),
                                isHost: false
                            }
                        ]
                    }
                };
                
                log('✅ Get meeting via mock service:');
                log(JSON.stringify(mockResult, null, 2));
                
            } catch (error) {
                log(`❌ Get meeting error: ${error.message}`);
            }
        }

        async function testChatHistory() {
            try {
                const meetingId = document.getElementById('meetingId').value;
                log(`💬 Testing chat history: ${meetingId}`);
                
                const mockResult = {
                    chatHistory: [
                        {
                            _id: 'msg-1',
                            message: '안녕하세요! 미팅에 오신 것을 환영합니다.',
                            sender: { _id: 'host', displayName: '호스트' },
                            createdAt: new Date(Date.now() - 3600000).toISOString(),
                            replyToMessageId: null
                        },
                        {
                            _id: 'msg-2',
                            message: '네, 안녕하세요!',
                            sender: { _id: 'participant-1', displayName: '참여자 1' },
                            createdAt: new Date(Date.now() - 1800000).toISOString(),
                            replyToMessageId: null
                        },
                        {
                            _id: 'msg-3',
                            message: '오늘 미팅 주제는 무엇인가요?',
                            sender: { _id: 'participant-2', displayName: '참여자 2' },
                            createdAt: new Date(Date.now() - 900000).toISOString(),
                            replyToMessageId: null
                        }
                    ]
                };
                
                log('✅ Chat history via mock service:');
                log(JSON.stringify(mockResult, null, 2));
                
            } catch (error) {
                log(`❌ Chat history error: ${error.message}`);
            }
        }

        function toggleControl(control) {
            controlStates[control] = !controlStates[control];
            const button = event.target;
            
            if (controlStates[control]) {
                button.classList.add('active');
                log(`✅ ${control} turned ON`);
            } else {
                button.classList.remove('active');
                log(`❌ ${control} turned OFF`);
            }
        }

        function leaveMeeting() {
            log('🚪 Leaving meeting...');
            alert('미팅을 종료하시겠습니까?');
        }

        // Initialize
        log('🧪 Meeting Page Test Ready!');
        log('Frontend: http://localhost:3000/meeting/test-meeting-123');
        log('Backend: http://localhost:3007');
    </script>
</body>
</html>
