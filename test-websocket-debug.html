<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Debug Test</title>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background-color: #1a1a1a;
            color: white;
        }
        .test-section {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #333;
            border-radius: 8px;
            background-color: #2a2a2a;
        }
        .success { border-color: #28a745; background-color: #1e3a1e; }
        .error { border-color: #dc3545; background-color: #3a1e1e; }
        .warning { border-color: #ffc107; background-color: #3a3a1e; }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #666; cursor: not-allowed; }
        .log {
            background-color: #1a1a1a;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 10px;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #555;
            border-radius: 4px;
            background-color: #333;
            color: white;
        }
        .status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .connected { background-color: #28a745; color: white; }
        .disconnected { background-color: #dc3545; color: white; }
        .connecting { background-color: #ffc107; color: black; }
    </style>
</head>
<body>
    <h1>WebSocket Debug Test</h1>
    
    <div class="test-section">
        <h3>1. Current JWT Token</h3>
        <textarea id="currentToken" rows="3" readonly></textarea>
        <button onclick="loadCurrentToken()">Load Current Token</button>
        <div id="tokenInfo"></div>
    </div>

    <div class="test-section">
        <h3>2. WebSocket Connection Test</h3>
        <div>
            <span>Status: </span>
            <span id="connectionStatus" class="status disconnected">Disconnected</span>
        </div>
        <button onclick="testWebSocketConnection()" id="connectBtn">Connect to Chat WebSocket</button>
        <button onclick="disconnectWebSocket()" id="disconnectBtn" disabled>Disconnect</button>
        <div id="connectionResult"></div>
    </div>

    <div class="test-section">
        <h3>3. Chat Room Test</h3>
        <input type="text" id="meetingId" placeholder="Meeting ID" value="68d9c93163602aa9f7619a50">
        <button onclick="joinChatRoom()" id="joinBtn" disabled>Join Chat Room</button>
        <button onclick="sendTestMessage()" id="sendBtn" disabled>Send Test Message</button>
        <div id="chatResult"></div>
    </div>

    <div class="test-section">
        <h3>4. Real-time Logs</h3>
        <div id="logs" class="log"></div>
    </div>

    <script>
        let socket = null;
        let isConnected = false;

        function log(message, type = 'info') {
            const logs = document.getElementById('logs');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.style.color = type === 'error' ? '#dc3545' : type === 'success' ? '#28a745' : type === 'warning' ? '#ffc107' : '#fff';
            logEntry.textContent = `[${timestamp}] ${message}`;
            logs.appendChild(logEntry);
            logs.scrollTop = logs.scrollHeight;
        }

        function updateConnectionStatus(status) {
            const statusEl = document.getElementById('connectionStatus');
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');
            const joinBtn = document.getElementById('joinBtn');
            const sendBtn = document.getElementById('sendBtn');

            statusEl.textContent = status;
            statusEl.className = `status ${status.toLowerCase()}`;

            if (status === 'Connected') {
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
                joinBtn.disabled = false;
                sendBtn.disabled = false;
            } else {
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
                joinBtn.disabled = true;
                sendBtn.disabled = true;
            }
        }

        function loadCurrentToken() {
            const token = localStorage.getItem('jwt');
            const tokenTextarea = document.getElementById('currentToken');
            const tokenInfo = document.getElementById('tokenInfo');
            
            if (token) {
                tokenTextarea.value = token;
                
                try {
                    const parts = token.split('.');
                    if (parts.length === 3) {
                        const payload = JSON.parse(atob(parts[1]));
                        const exp = new Date(payload.exp * 1000);
                        const now = new Date();
                        
                        tokenInfo.innerHTML = `
                            <div class="success">
                                ✅ Token found<br>
                                User ID: ${payload.sub || 'N/A'}<br>
                                Expires: ${exp.toLocaleString()}<br>
                                Status: ${exp > now ? 'Valid' : 'Expired'}
                            </div>
                        `;
                        log('✅ JWT token loaded and decoded', 'success');
                    } else {
                        tokenInfo.innerHTML = `
                            <div class="error">
                                ❌ Invalid JWT format
                            </div>
                        `;
                        log('❌ Invalid JWT format', 'error');
                    }
                } catch (error) {
                    tokenInfo.innerHTML = `
                        <div class="error">
                            ❌ Failed to decode JWT: ${error.message}
                        </div>
                    `;
                    log(`❌ Failed to decode JWT: ${error.message}`, 'error');
                }
            } else {
                tokenTextarea.value = '';
                tokenInfo.innerHTML = `
                    <div class="warning">
                        ⚠️ No JWT token found in localStorage
                    </div>
                `;
                log('⚠️ No JWT token found', 'warning');
            }
        }

        function testWebSocketConnection() {
            const token = localStorage.getItem('jwt');
            const resultDiv = document.getElementById('connectionResult');
            
            if (!token) {
                resultDiv.innerHTML = `
                    <div class="error">
                        ⚠️ No JWT token found. Please login first.
                    </div>
                `;
                return;
            }

            updateConnectionStatus('Connecting');
            resultDiv.innerHTML = 'Connecting to chat WebSocket...';
            log('🔌 Attempting to connect to chat WebSocket...', 'info');
            
            try {
                socket = io('http://localhost:3007/chat', {
                    auth: { token },
                    transports: ['websocket', 'polling'],
                    timeout: 30000,
                    forceNew: true
                });

                socket.on('connect', () => {
                    isConnected = true;
                    updateConnectionStatus('Connected');
                    resultDiv.innerHTML = `
                        <div class="success">
                            ✅ WebSocket connected successfully!<br>
                            Socket ID: ${socket.id}
                        </div>
                    `;
                    log('✅ WebSocket connected successfully', 'success');
                });

                socket.on('disconnect', (reason) => {
                    isConnected = false;
                    updateConnectionStatus('Disconnected');
                    log(`🔌 WebSocket disconnected: ${reason}`, 'warning');
                });

                socket.on('connect_error', (error) => {
                    isConnected = false;
                    updateConnectionStatus('Disconnected');
                    resultDiv.innerHTML = `
                        <div class="error">
                            ❌ WebSocket connection failed<br>
                            Error: ${error.message}
                        </div>
                    `;
                    log(`❌ WebSocket connection failed: ${error.message}`, 'error');
                });

                socket.on('ERROR', (data) => {
                    log(`❌ Server error: ${data.message}`, 'error');
                    resultDiv.innerHTML = `
                        <div class="error">
                            ❌ Server error: ${data.message}
                        </div>
                    `;
                });

                socket.on('CHAT_PEER_LIST', (data) => {
                    log(`👥 Chat participants: ${JSON.stringify(data)}`, 'info');
                });

                socket.on('CHAT_MESSAGE', (message) => {
                    log(`📨 Received message: ${message.text} from ${message.displayName}`, 'info');
                });

            } catch (error) {
                isConnected = false;
                updateConnectionStatus('Disconnected');
                resultDiv.innerHTML = `
                    <div class="error">
                        ❌ Failed to create WebSocket<br>
                        Error: ${error.message}
                    </div>
                `;
                log(`❌ Failed to create WebSocket: ${error.message}`, 'error');
            }
        }

        function joinChatRoom() {
            if (!socket || !isConnected) {
                log('❌ Not connected to WebSocket', 'error');
                return;
            }

            const meetingId = document.getElementById('meetingId').value;
            if (!meetingId) {
                log('❌ Please enter a meeting ID', 'error');
                return;
            }

            log(`📤 Joining chat room: ${meetingId}`, 'info');
            socket.emit('JOIN_CHAT_ROOM', { meetingId });
        }

        function sendTestMessage() {
            if (!socket || !isConnected) {
                log('❌ Not connected to WebSocket', 'error');
                return;
            }

            const meetingId = document.getElementById('meetingId').value;
            if (!meetingId) {
                log('❌ Please enter a meeting ID', 'error');
                return;
            }

            const message = `Test message at ${new Date().toLocaleTimeString()}`;
            log(`📤 Sending test message: ${message}`, 'info');
            socket.emit('SEND_CHAT_MESSAGE', {
                meetingId,
                message
            });
        }

        function disconnectWebSocket() {
            if (socket) {
                socket.disconnect();
                socket = null;
                isConnected = false;
                updateConnectionStatus('Disconnected');
                log('🔌 WebSocket disconnected manually', 'warning');
            }
        }

        // Auto-load token on page load
        window.addEventListener('load', () => {
            log('🚀 Starting WebSocket debug tests...', 'info');
            loadCurrentToken();
        });
    </script>
</body>
</html>
