<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test All Mutations Fixed</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        .warning { color: orange; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
        h3 { margin-top: 0; color: #333; }
    </style>
</head>
<body>
    <h1>Test All Mutations Fixed</h1>
    <p>This test verifies that all GraphQL mutations now use the correct schema structure without success/message wrapper fields.</p>
    
    <div class="section">
        <h3>🧪 Mutation Tests</h3>
        <button onclick="testAllMutations()">Test All Mutations</button>
        <button onclick="clearLogs()">Clear Logs</button>
    </div>
    
    <div id="logs"></div>

    <script>
        const GRAPHQL_ENDPOINT = 'http://localhost:3007/graphql';
        
        function log(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const logDiv = document.createElement('div');
            logDiv.className = `log ${type}`;
            logDiv.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logsDiv.appendChild(logDiv);
            console.log(message);
        }
        
        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
        }
        
        async function testAllMutations() {
            log('🚀 Testing all mutations with corrected schema...', 'info');
            
            const mutations = [
                {
                    name: 'CREATE_MEETING',
                    query: `
                        mutation CreateMeeting($input: CreateMeetingInput!) {
                            createMeeting(input: $input) {
                                _id
                                title
                                status
                                inviteCode
                                hostId
                            }
                        }
                    `,
                    variables: {
                        input: {
                            title: 'Schema Test Meeting',
                            notes: 'Testing corrected schema',
                            isPrivate: false
                        }
                    },
                    expectsWrapper: false
                },
                {
                    name: 'START_MEETING',
                    query: `
                        mutation StartMeeting($meetingId: ID!) {
                            startMeeting(meetingId: $meetingId) {
                                _id
                                title
                                status
                                actualStartAt
                            }
                        }
                    `,
                    variables: {
                        meetingId: 'test-meeting-id'
                    },
                    expectsWrapper: false
                },
                {
                    name: 'END_MEETING',
                    query: `
                        mutation EndMeeting($meetingId: ID!) {
                            endMeeting(meetingId: $meetingId) {
                                _id
                                title
                                status
                                endedAt
                            }
                        }
                    `,
                    variables: {
                        meetingId: 'test-meeting-id'
                    },
                    expectsWrapper: false
                },
                {
                    name: 'JOIN_MEETING',
                    query: `
                        mutation JoinMeeting($input: JoinParticipantInput!) {
                            joinMeeting(input: $input) {
                                _id
                                displayName
                                role
                                userId
                                meetingId
                            }
                        }
                    `,
                    variables: {
                        input: {
                            meetingId: 'test-meeting-id',
                            displayName: 'Test Participant',
                            role: 'PARTICIPANT'
                        }
                    },
                    expectsWrapper: false
                }
            ];
            
            for (const mutation of mutations) {
                await testMutation(mutation);
                await new Promise(resolve => setTimeout(resolve, 500));
            }
            
            log('✅ All mutation tests completed!', 'success');
        }
        
        async function testMutation(mutation) {
            log(`🧪 Testing ${mutation.name}...`, 'info');
            
            try {
                const response = await fetch(GRAPHQL_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: mutation.query,
                        variables: mutation.variables
                    })
                });
                
                const data = await response.json();
                
                if (data.errors) {
                    const firstError = data.errors[0];
                    
                    // Check for the specific schema mismatch errors we're trying to fix
                    if (firstError.message.includes('Cannot query field "success"') || 
                        firstError.message.includes('Cannot query field "message"')) {
                        log(`❌ ${mutation.name}: Still has schema mismatch! ${firstError.message}`, 'error');
                    } else if (firstError.message.includes('TOKEN_NOT_EXIST') || 
                              firstError.message.includes('Unauthorized') ||
                              firstError.message.includes('not found')) {
                        log(`✅ ${mutation.name}: Schema is correct (authorization/not found error is expected)`, 'success');
                    } else {
                        log(`⚠️ ${mutation.name}: Different error: ${firstError.message}`, 'warning');
                    }
                } else if (data.data) {
                    const mutationName = Object.keys(data.data)[0];
                    const result = data.data[mutationName];
                    
                    if (mutation.expectsWrapper) {
                        if (result.success !== undefined && result.message !== undefined) {
                            log(`✅ ${mutation.name}: Wrapper structure correct`, 'success');
                        } else {
                            log(`❌ ${mutation.name}: Expected wrapper structure not found`, 'error');
                        }
                    } else {
                        if (result._id || result.success === undefined) {
                            log(`✅ ${mutation.name}: Direct response structure correct`, 'success');
                        } else {
                            log(`❌ ${mutation.name}: Unexpected response structure`, 'error');
                        }
                    }
                } else {
                    log(`❌ ${mutation.name}: No data or errors in response`, 'error');
                }
            } catch (error) {
                log(`❌ ${mutation.name}: Network error: ${error.message}`, 'error');
            }
        }
        
        // Auto-test on page load
        window.onload = function() {
            log('🚀 Page loaded, ready to test all mutations with corrected schema', 'info');
            log('💡 This will verify that all mutations use the correct structure without success/message wrappers', 'info');
        };
    </script>
</body>
</html>
