<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Request Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        .warning { color: orange; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Frontend Request Test</h1>
    <p>This test simulates the exact request that the frontend would make.</p>
    
    <div>
        <button onclick="testFrontendRequest()">Test Frontend Request</button>
        <button onclick="testWithDifferentTokens()">Test Different Tokens</button>
        <button onclick="clearLogs()">Clear Logs</button>
    </div>
    
    <div id="logs"></div>

    <script>
        function log(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const logDiv = document.createElement('div');
            logDiv.className = `log ${type}`;
            logDiv.innerHTML = message;
            logsDiv.appendChild(logDiv);
            console.log(message);
        }
        
        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
        }
        
        function testFrontendRequest() {
            log('🧪 Testing the exact request that the frontend would make...', 'info');
            
            // Simulate the exact logic from simple-auth-handlers.ts
            const jwtToken = localStorage.getItem('jwt');
            const tokenKey = localStorage.getItem('token');
            const token = jwtToken || tokenKey;
            
            log(`<strong>Token selection logic:</strong><br>jwt: ${jwtToken ? 'Present' : 'Missing'}<br>token: ${tokenKey ? 'Present' : 'Missing'}<br>Selected: ${token ? 'jwt || token' : 'null'}`, 'info');
            
            if (!token) {
                log('❌ No token found - frontend would make unauthenticated request', 'error');
                return;
            }
            
            log(`<strong>Selected token:</strong><br><pre>${token.substring(0, 50)}...</pre>`, 'info');
            
            // Test with the exact same request format as the frontend
            const requestBody = {
                query: 'query { me { _id displayName email systemRole } }',
                variables: {}
            };
            
            log(`<strong>Request body:</strong><br><pre>${JSON.stringify(requestBody, null, 2)}</pre>`, 'info');
            
            fetch('http://localhost:3007/graphql', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'apollo-require-preflight': 'true',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(requestBody)
            })
            .then(response => {
                log(`<strong>Response status:</strong> ${response.status}`, response.ok ? 'success' : 'error');
                log(`<strong>Response headers:</strong><br><pre>${JSON.stringify(Object.fromEntries(response.headers.entries()), null, 2)}</pre>`, 'info');
                return response.json();
            })
            .then(data => {
                if (data.errors) {
                    const firstError = data.errors[0];
                    log(`❌ Frontend request failed: ${firstError.message}`, 'error');
                    
                    if (firstError.message.includes('jwt malformed')) {
                        log('🔍 The token format is malformed', 'error');
                    } else if (firstError.message.includes('jwt expired')) {
                        log('🔍 The token has expired', 'error');
                    } else if (firstError.message.includes('jwt signature')) {
                        log('🔍 The token signature is invalid', 'error');
                    } else {
                        log(`🔍 Other error: ${firstError.message}`, 'error');
                    }
                } else if (data.data) {
                    log(`✅ Frontend request successful! User: ${JSON.stringify(data.data.me, null, 2)}`, 'success');
                } else {
                    log('❌ Unexpected response from backend', 'error');
                }
            })
            .catch(error => {
                log(`❌ Network error: ${error.message}`, 'error');
            });
        }
        
        function testWithDifferentTokens() {
            log('🧪 Testing with different token combinations...', 'info');
            
            const tokens = [
                { name: 'jwt', value: localStorage.getItem('jwt') },
                { name: 'token', value: localStorage.getItem('token') },
                { name: 'accessToken', value: localStorage.getItem('accessToken') }
            ];
            
            tokens.forEach(({ name, value }) => {
                if (!value) {
                    log(`❌ ${name}: No token found`, 'error');
                    return;
                }
                
                log(`<strong>Testing ${name} token:</strong><br><pre>${value.substring(0, 50)}...</pre>`, 'info');
                
                fetch('http://localhost:3007/graphql', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${value}`
                    },
                    body: JSON.stringify({
                        query: 'query { me { _id displayName email systemRole } }'
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.errors) {
                        const firstError = data.errors[0];
                        log(`❌ ${name} token failed: ${firstError.message}`, 'error');
                    } else if (data.data) {
                        log(`✅ ${name} token successful! User: ${JSON.stringify(data.data.me, null, 2)}`, 'success');
                    } else {
                        log(`❌ ${name} token: Unexpected response`, 'error');
                    }
                })
                .catch(error => {
                    log(`❌ ${name} token network error: ${error.message}`, 'error');
                });
            });
        }
        
        // Auto-test on page load
        window.onload = function() {
            log('🚀 Frontend Request Test loaded', 'info');
            testFrontendRequest();
        };
    </script>
</body>
</html>
