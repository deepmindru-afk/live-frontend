<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Create Meeting Fix</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>Test Create Meeting Fix</h1>
    <p>This test will verify that the createMeeting mutation now works with the correct backend response structure.</p>
    
    <button onclick="testCreateMeeting()">Test Create Meeting</button>
    <button onclick="clearLogs()">Clear Logs</button>
    
    <div id="logs"></div>

    <script>
        const GRAPHQL_ENDPOINT = 'http://localhost:3007/graphql';
        
        function log(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const logDiv = document.createElement('div');
            logDiv.className = `log ${type}`;
            logDiv.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logsDiv.appendChild(logDiv);
            console.log(message);
        }
        
        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
        }
        
        async function testCreateMeeting() {
            log('🧪 Starting createMeeting test...', 'info');
            
            try {
                const response = await fetch(GRAPHQL_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: `
                            mutation CreateMeeting($input: CreateMeetingInput!) {
                                createMeeting(input: $input) {
                                    _id
                                    title
                                    status
                                    inviteCode
                                    isPrivate
                                    scheduledFor
                                    actualStartAt
                                    endedAt
                                    durationMin
                                    notes
                                    participantCount
                                    createdAt
                                    updatedAt
                                    hostId
                                    host {
                                        _id
                                        email
                                        displayName
                                        systemRole
                                        avatarUrl
                                        department
                                        organization
                                    }
                                }
                            }
                        `,
                        variables: {
                            input: {
                                title: 'Test Meeting - Fixed Structure',
                                notes: 'Testing the fixed createMeeting mutation',
                                isPrivate: false
                            }
                        }
                    })
                });
                
                const data = await response.json();
                log(`📡 Response received: ${JSON.stringify(data, null, 2)}`, 'info');
                
                if (data.errors) {
                    log(`❌ GraphQL Errors: ${JSON.stringify(data.errors, null, 2)}`, 'error');
                    
                    // Check if it's the old updatedAt error
                    if (data.errors[0].message.includes('updatedAt')) {
                        log('❌ The updatedAt error is still present!', 'error');
                    } else if (data.errors[0].message.includes('hostId')) {
                        log('❌ The hostId error is still present!', 'error');
                    } else {
                        log(`❌ Different error: ${data.errors[0].message}`, 'error');
                    }
                } else if (data.data && data.data.createMeeting) {
                    const result = data.data.createMeeting;
                    if (result._id) {
                        log('✅ Meeting created successfully!', 'success');
                        log(`🆔 ID: ${result._id}`, 'success');
                        log(`📝 Title: ${result.title}`, 'success');
                        log(`🔑 Invite Code: ${result.inviteCode}`, 'success');
                        log(`📅 Created: ${result.createdAt}`, 'success');
                        log(`📅 Updated: ${result.updatedAt}`, 'success');
                        log(`👤 Host ID: ${result.hostId}`, 'success');
                        log(`👥 Participants: ${result.participantCount}`, 'success');
                    } else {
                        log('❌ Unexpected response structure', 'error');
                    }
                } else {
                    log('❌ No data in response', 'error');
                }
            } catch (error) {
                log(`❌ Network Error: ${error.message}`, 'error');
            }
        }
        
        // Auto-test on page load
        window.onload = function() {
            log('🚀 Page loaded, ready to test createMeeting fix', 'info');
        };
    </script>
</body>
</html>
